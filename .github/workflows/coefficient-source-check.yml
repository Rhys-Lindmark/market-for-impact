name: Coefficient source freshness

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coefficient-source-freshness
  cancel-in-progress: true

jobs:
  check-effective-giving-careers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare committed snapshot with Coefficient's public index
        run: node scripts/refresh-coefficient.mjs
