name: Mobile release gate

on:
  pull_request:
    paths:
      - 'app/**'
      - 'drizzle/**'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'wrangler.mobile.jsonc'
      - '.github/workflows/mobile-release-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    # The full two-viewport suite now has 446 tests; 12 minutes repeatedly
    # cancels the job after the geography cases pass, before the suite finishes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Apply the complete local D1 migration chain
        run: npx wrangler d1 migrations apply DB --local --config wrangler.mobile.jsonc --persist-to .wrangler/state
      - run: npm run test:mobile
