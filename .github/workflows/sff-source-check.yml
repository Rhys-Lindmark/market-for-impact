name: San Francisco Foundation source freshness

on:
  pull_request:
    paths:
      - '.github/workflows/sff-source-check.yml'
      - 'data/san-francisco/sff-*'
      - 'scripts/check-sff-fy25-source.mjs'
      - 'scripts/import-sff-fiscal-sponsors.mjs'
      - 'scripts/build-sf-sff-grants.mjs'
      - 'scripts/lib/sf-sff-grants.mjs'
      - 'scripts/lib/sf-sff-fiscal-sponsors.mjs'
      - 'scripts/sf-sff-grants.test.mjs'
      - 'scripts/sf-sff-fiscal-sponsors.test.mjs'
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sff-source-freshness
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate normalized snapshot
        run: node scripts/build-sf-sff-grants.mjs
      - name: Run SFF contract tests
        run: node --test scripts/sf-sff-grants.test.mjs scripts/sf-sff-fiscal-sponsors.test.mjs
      - name: Verify official PDF is unchanged
        run: node scripts/check-sff-fy25-source.mjs
      - name: Verify official fiscal-sponsor corpus is unchanged
        run: node scripts/import-sff-fiscal-sponsors.mjs
