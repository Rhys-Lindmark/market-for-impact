<!doctype html><html lang="en"><meta charset="utf-8"><title>SF research progress</title><style>body{font:18px/1.6 system-ui;max-width:850px;margin:40px auto;padding:20px}svg{width:100%;height:120px}li{margin:8px 0}</style><h1>San Francisco research progress</h1><p id="state">Loading progress…</p><ul id="items"></ul><svg viewBox="0 0 800 120" role="img" aria-label="Accepted items over time"><polyline id="chart" fill="none" stroke="#176b82" stroke-width="3"/></svg><p><a href="sf-progress.md">Phase acceptance criteria and recovery state</a></p><script>fetch('./sf-progress.json').then(r=>r.json()).then(d=>{document.querySelector('#state').textContent=(d.publishedReports??0)+' published reports · '+(d.deepReviewProgress?.published??0)+'/10 deeper reviews · '+(d.expenseCoverage?.release??0)+'/91 expense averages · Phase '+d.phase+' · '+d.items.filter(x=>x.done).length+'/'+d.items.length+' accepted · '+(d.blockers.length?d.blockers.join('; '):'No blockers recorded');for(const x of d.items){const li=document.createElement('li');li.textContent=(x.done?'☑':'☐')+' '+x.id+': '+x.label;document.querySelector('#items').append(li)}document.querySelector('#chart').setAttribute('points',d.history.map((p,i)=>(10+i*780/Math.max(1,d.history.length-1))+','+(110-p.complete*10)).join(' '))}).catch(()=>{document.querySelector('#state').textContent='Serve this directory over HTTP to load sf-progress.json.'})</script></html>
